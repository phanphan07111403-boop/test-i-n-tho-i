<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MooWii L1 charge + đi</title>
  <style>
    :root {
      --bg: #12141c;
      --panel: #1c2030;
      --ink: #e8ecf7;
      --muted: #9aa3b8;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --l1: #7aa2ff;
      --stick: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.45rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    button {
      background: #2a3148;
      color: var(--ink);
      border: 1px solid #3b4460;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button.active-ok { outline: 2px solid var(--ok); }
    button.active-bad { outline: 2px solid var(--bad); }
    .status {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel);
      margin-bottom: 16px;
    }
    .hud {
      position: relative;
      height: 360px;
      border-radius: 16px;
      background: linear-gradient(#1a2233, #141820);
      overflow: hidden;
      border: 1px solid #2e3650;
    }
    .champ {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: #f4f7ff;
      box-shadow: 0 0 0 4px rgba(244, 247, 255, 0.15);
    }
    .charge-ring {
      position: absolute;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      border: 3px solid transparent;
      pointer-events: none;
    }
    .charge-ring.on { border-color: var(--l1); }
    .wheel, .skill {
      position: absolute;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
    }
    .wheel {
      left: 28px;
      bottom: 28px;
      width: 120px;
      height: 120px;
      background: rgba(255, 209, 102, 0.12);
      border: 2px solid var(--stick);
      color: var(--stick);
    }
    .knob {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--stick);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }
    .skill {
      right: 36px;
      bottom: 70px;
      width: 64px;
      height: 64px;
      background: rgba(122, 162, 255, 0.16);
      border: 2px solid var(--l1);
      color: var(--l1);
    }
    .finger {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }
    .finger.show { opacity: 1; }
    .finger.a { background: var(--stick); box-shadow: 0 0 0 6px rgba(255, 209, 102, 0.25); }
    .finger.b { background: var(--l1); box-shadow: 0 0 0 6px rgba(122, 162, 255, 0.25); }
    kbd {
      background: #2a3148;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <main>
    <h1>L1 charge skill 1, vẫn đi được</h1>
    <p class="lead">
      Đúng: hai ngón ảo độc lập. Sai: một ngón — đè L1 thì hết slot, stick không đi.
      Giữ <kbd>L</kbd> = L1. <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> = stick trái.
    </p>
    <div class="row">
      <button id="mode-ok" class="active-ok" type="button">Cấu hình đúng: Gán phím + 2 pointer</button>
      <button id="mode-bad" type="button">Cấu hình sai: 1 pointer / L1 cướp stick</button>
    </div>
    <div class="status" id="status">Hai ngón: đè L1 tụ chiêu, WASD vẫn đi. Thả L1 thì cast.</div>
    <div class="hud" id="hud" aria-label="Mô phỏng HUD">
      <div class="charge-ring" id="ring"></div>
      <div class="champ" id="champ"></div>
      <div class="wheel">STICK
        <span class="knob" id="knob"></span>
      </div>
      <div class="skill" id="skill">S1</div>
      <span class="finger a" id="fingerA"></span>
      <span class="finger b" id="fingerB"></span>
    </div>
  </main>
  <script>
    const hud = document.getElementById("hud");
    const champ = document.getElementById("champ");
    const ring = document.getElementById("ring");
    const knob = document.getElementById("knob");
    const skill = document.getElementById("skill");
    const fingerA = document.getElementById("fingerA");
    const fingerB = document.getElementById("fingerB");
    const status = document.getElementById("status");
    const modeOk = document.getElementById("mode-ok");
    const modeBad = document.getElementById("mode-bad");

    let twoPointers = true;
    let l1Down = false;
    let keys = { w: false, a: false, s: false, d: false };
    let x = 0.5;
    let y = 0.5;

    function setMode(ok) {
      twoPointers = ok;
      modeOk.classList.toggle("active-ok", ok);
      modeBad.classList.toggle("active-bad", !ok);
      status.textContent = ok
        ? "Hai ngón: đè L1 tụ chiêu, WASD vẫn đi. Thả L1 thì cast."
        : "Một ngón: đè L1 thì stick chết. Đây là lỗi MooWii đang gặp.";
    }

    modeOk.addEventListener("click", () => setMode(true));
    modeBad.addEventListener("click", () => setMode(false));

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "l") l1Down = true;
      if (key in keys) keys[key] = true;
    });
    window.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "l") l1Down = false;
      if (key in keys) keys[key] = false;
    });

    function placeFinger(el, target) {
      const hudBox = hud.getBoundingClientRect();
      const box = target.getBoundingClientRect();
      el.style.left = `${box.left - hudBox.left + box.width / 2 - 9}px`;
      el.style.top = `${box.top - hudBox.top + box.height / 2 - 9}px`;
    }

    function tick() {
      const canMove = twoPointers || !l1Down;
      let dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
      let dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
      if (!canMove) {
        dx = 0;
        dy = 0;
      }
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      const moving = canMove && (keys.w || keys.a || keys.s || keys.d);
      if (moving) {
        x = Math.min(0.86, Math.max(0.14, x + dx * 0.01));
        y = Math.min(0.82, Math.max(0.18, y + dy * 0.01));
      }
      champ.style.left = `${x * 100}%`;
      champ.style.top = `${y * 100}%`;
      ring.style.left = champ.style.left;
      ring.style.top = champ.style.top;
      ring.classList.toggle("on", l1Down);
      knob.style.left = `${50 + dx * 28}%`;
      knob.style.top = `${50 + dy * 28}%`;
      fingerA.classList.toggle("show", moving);
      fingerB.classList.toggle("show", l1Down);
      if (moving) placeFinger(fingerA, document.querySelector(".wheel"));
      if (l1Down) placeFinger(fingerB, skill);
      requestAnimationFrame(tick);
    }
    setMode(true);
    tick();
  </script>
</body>
</html>
